[package]
description = "Code Coverage Language Server"
repository = "https://github.com/fargies/coverage-lsp"
readme = "../README.md"
name = "coverage-lsp"
version = "1.1.2"
edition = "2024"
license = "Zlib"

[dependencies]
csscolorparser = { version = "0.9.0", features = ["serde"] }
humantime-serde = "1.1.1"
lcov = "0.8.2"
serde = { version = "1.0.229", features = ["rc"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = [
    "io-std",
    "macros",
    "rt-multi-thread",
    "fs",
    "time",
] }
tower-lsp = "0.20.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
ctor = "1.0.13"

[package.metadata.release]
pre-release-hook = [
    "git",
    "cliff",
    "--repository=..",
    "--output=../ChangeLog.md",
    "--tag=coverage-lsp-{{version}}",
    "--tag-pattern=coverage-lsp-v.*",
    "--exclude-path=zed-coverage-lsp/**",
]
